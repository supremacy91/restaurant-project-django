{% extends "base.html" %}

{% block title %}
  Login
{% endblock %}

{% block content %}
  <h1>Login</h1>

  {% if form.errors %}
    <p>Username or password is incorrect.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
      Login
    </button>

    {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
  </form>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete dish type</title>
</head>
<body>
  <h1>Delete dish type</h1>

  <p>
    Are you sure you want to delete
    <strong>{{ dishtype }}</strong>?
  </p>

  <p>
    All dishes connected to this type will also be deleted.
  </p>

  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete">
  </form>

  <a href="{% url 'kitchen:dish-type-list' %}">
    Cancel
  </a>
</body>
</html>

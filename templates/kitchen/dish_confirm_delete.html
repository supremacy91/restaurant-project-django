{% extends "base.html" %}

{% block title %}
  Delete dish
{% endblock %}

{% block content %}
  <h1>Delete dish</h1>

  <p>
    Are you sure you want to delete
    <strong>{{ object.name }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}

    <button type="submit">
      Yes, delete
    </button>
  </form>

  <p>
    <a href="{% url 'kitchen:dish-detail' pk=object.pk %}">
      Cancel
    </a>
  </p>
{% endblock %}

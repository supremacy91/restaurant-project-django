<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Dish Types</title>
</head>
<body>
  <h1>Dish Type List</h1>

  {% if dishtype_list %}
    <ul>
      {% for dish_type in dishtype_list %}
        <li>
          {{ dish_type.name }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no dish types.</p>
  {% endif %}
</body>
</html>
